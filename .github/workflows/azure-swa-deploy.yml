name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The build prerenders the page with headless Chromium so crawlers that do
      # not run JavaScript get real content. Only Chromium is needed.
      - name: Install Chromium for prerendering
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Fails the deploy if the built page errors, renders no text, or has a
      # broken image.
      - name: Verify built site
        run: node scripts/verify-build.mjs

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
